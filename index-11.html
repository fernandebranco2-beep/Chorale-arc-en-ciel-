<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion de Chorale</title>
<style>
:root{--bg:#f4f5f9;--c:#fff;--t:#1d2233;--m:#6b7289;--p:#3b4cca;--ok:#1e9e5a;--ko:#d6394a;--w:#e0a100;--b:#e2e5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--c:#1c1f2b;--t:#eceef6;--m:#99a0b8;--p:#7c8cff;--b:#2c3042}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;padding-bottom:70px}
.top{background:var(--p);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top b{font-size:17px}main{padding:12px;max-width:760px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{color:var(--m);font-size:13px}
button,select,input,textarea{font:inherit;padding:10px;border-radius:9px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:3px 0}
button{background:var(--p);color:#fff;border:0;width:auto;cursor:pointer;margin:3px 3px 3px 0}button.s{background:var(--c);color:var(--t);border:1px solid var(--b)}button.k{background:var(--ko)}button.g{background:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}.row:last-child{border:0}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1 0 62px;text-align:center;padding:8px 4px;font-size:11px;color:var(--m);text-decoration:none}.nav a.on{color:var(--p);font-weight:700}.nav a i{display:block;font-style:normal;font-size:20px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--b)}.ok{color:var(--ok)}.ko{color:var(--ko)}.m{color:var(--m);font-size:13px}h3{margin:6px 0}
</style><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3b4cca"><link rel="icon" href="icon-192.png"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div class="top"><b>🎵 Chorale</b><span id="who" class="m" style="color:#fff"></span></div>
<main id="app"></main><nav class="nav" id="nav"></nav>
<script>
const ROLES=["Président","Vice-président","Surveillant","Surveillante adjointe","Secrétaire","Secrétaire adjointe","Trésorier","MC","MCA","Conseiller 1","Conseillère 1","Conseiller 2","Conseillère 2"];
const ALL=["home","ch","pr","co","ca","de","mt","ra","us"];
const PERM={"Président":ALL,"Vice-président":ALL.filter(x=>x!="us"),"Surveillant":["home","ch","pr","ra"],"Surveillante adjointe":["home","ch","pr","ra"],"Secrétaire":["home","ch","pr","ra"],"Secrétaire adjointe":["home","ch","pr","ra"],"Trésorier":["home","co","ca","de","mt","ra"]};
const OTHER=["home","ch","de","mt"];const can=m=>(PERM[me.role]||OTHER).includes(m);
const APPROVE=["Président","Vice-président","Trésorier"];
const NAV={home:["🏠","Accueil"],ch:["👥","Choristes"],pr:["📋","Présences"],co:["💰","Cotisations"],ca:["🏦","Caisse"],de:["💸","Demandes"],mt:["🎵","Matériels"],ra:["📊","Rapports"],us:["⚙️","Comptes"]};
const C=["choristes","sessions","records","tx","requests","users","logs","settings","materials"];
let S={},db,me=null,tab="home",sid=null,fid=null,q="",D={};const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F=n=>Number(n||0).toLocaleString("fr-FR")+" FCFA";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("chorale:"+s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const cfg=()=>Object.assign({cot:25,init:0,seuil:5000,reg:80,moy:60,lock:3},S.settings?.find(x=>x.id=="main")||{});
const act=(t)=>db.collection("logs").doc(uid()).set({t:me.name+" ("+me.role+") : "+t,d:new Date().toISOString()});
const put=(c,id,o)=>db.collection(c).doc(id).set(o);
const CFG={apiKey:"AIzaSyBx5duS5nY8TW0HuDS2CFPHrCWPty_qrks",authDomain:"chorale-arc-en-ciel-59d4b.firebaseapp.com",projectId:"chorale-arc-en-ciel-59d4b",storageBucket:"chorale-arc-en-ciel-59d4b.firebasestorage.app",messagingSenderId:"801383645107",appId:"1:801383645107:web:8cbe0f176cf351b1d515c6"};
firebase.initializeApp(CFG);const auth=firebase.auth(),fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let creating=false,un=[];
function stop(){un.forEach(f=>f());un=[]}
async function loadMe(u){try{const d=await fs.collection("users").doc(u.uid).get();if(!d.exists||d.data().actif===false){alert("Compte non autorisé");return auth.signOut()}me={id:u.uid,...d.data()}}catch(e){$("app").innerHTML='<div class="card">Connexion impossible. Réessayez avec du réseau.</div>';return}start()}
function start(){stop();S.ready=0;const f={};C.forEach(c=>un.push(fs.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));f[c]=1;if(C.every(x=>f[x])){S.ready=1;draw()}},()=>{S[c]=[];f[c]=1;if(C.every(x=>f[x])){S.ready=1;draw()}})))}
function boot(){db=fs;auth.onAuthStateChanged(u=>{if(creating)return;if(!u){stop();me=null;S.ready=1;return draw()}loadMe(u)})}
function sessionRate(sess){const r=S.records.filter(x=>x.sid==sess.id);const p=r.filter(x=>x.st=="P"||x.st=="R").length;return r.length?Math.round(p*100/r.length):0}
function reg(cid){const act=S.records.filter(r=>r.cid==cid&&S.sessions.find(s=>s.id==r.sid)?.type!="Événement");const tot=act.length;const p=act.filter(x=>x.st=="P"||x.st=="R").length;const pc=tot?Math.round(p*100/tot):100;const k=cfg();return{tot,p,pc,cat:pc>=k.reg?"🟢 Régulier":pc>=k.moy?"🟡 Moyen":"🔴 Irrégulier"}}
const solde=()=>cfg().init+S.tx.filter(t=>!t.void).reduce((a,t)=>a+(t.type=="in"?t.amt:-t.amt),0);
const actifs=()=>S.choristes.filter(c=>c.actif!==false).sort((a,b)=>a.nom.localeCompare(b.nom));
function draw(){
 if(!S.ready){$("app").innerHTML='<div class="card">Chargement…</div>';return}
 if(!me)return loginUI();
 $("who").textContent=me.name;
 $("nav").innerHTML=ALL.filter(can).map(m=>`<a href="#" class="${tab==m?"on":""}" onclick="tab='${m}';sid=null;fid=null;draw();return false"><i>${NAV[m][0]}</i>${NAV[m][1]}</a>`).join("")+`<a href="#" onclick="out();return false"><i>🚪</i>Sortir</a>`;
 if(!can(tab))tab="home";
 $("app").innerHTML=(tab=="ch"&&fid)?V.fiche():V[tab]();
}
const V={
home(){const ss=S.sessions.sort((a,b)=>b.date.localeCompare(a.date));const lr=ss.find(s=>s.type=="Répétition"),lm=ss.find(s=>s.type=="Messe");
 const cnt=(s,st)=>s?S.records.filter(r=>r.sid==s.id&&(st?(r.st=="P"||r.st=="R"):r.st=="A")).length:"–";
 const irr=actifs().filter(c=>reg(c.id).cat.includes("🔴")&&reg(c.id).tot>0).length;
 const due=S.records.filter(r=>!r.paid&&S.sessions.find(s=>s.id==r.sid)?.cot).length;
 const al=[];if(due)al.push(`${due} cotisation(s) non payée(s)`);if(irr)al.push(`${irr} choriste(s) irrégulier(s)`);const pen=S.requests.filter(r=>r.st=="W").length;if(pen)al.push(`${pen} demande(s) d'argent en attente`);if(solde()<cfg().seuil)al.push("Caisse sous le seuil minimum");
 return `${S.choristes.length?"":`<div class="card">Aucune donnée. <button onclick="demo()">Charger données de démonstration</button></div>`}
 <div class="grid"><div class="stat"><b>👥 ${actifs().length}</b><span>Choristes actifs</span></div><div class="stat"><b>🎵 ${cnt(lr,1)}</b><span>Présents répétition (abs. ${cnt(lr)})</span></div><div class="stat"><b>⛪ ${cnt(lm,1)}</b><span>Présents messe (abs. ${cnt(lm)})</span></div><div class="stat"><b>⚠️ ${irr}</b><span>Irréguliers</span></div>
 ${can("ca")?`<div class="stat"><b>🏦 ${F(solde())}</b><span>Solde caisse</span></div><div class="stat"><b>💰 ${S.tx.filter(t=>!t.void&&t.cat.startsWith("Cotisation")).reduce((a,t)=>a+t.amt,0).toLocaleString("fr-FR")}</b><span>Cotisations collectées (FCFA)</span></div>`:""}</div>
 ${al.length?`<div class="card" style="margin-top:10px"><b>Alertes</b>${al.map(a=>`<div class="row">⚠️ ${a}</div>`).join("")}</div>`:""}
 <div class="card"><b>Dernières activités</b>${S.logs.sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5).map(l=>`<div class="row m">${esc(l.t)}</div>`).join("")||"<div class=m>Rien pour l'instant</div>"}</div>`},
ch(){const L=actifs().filter(c=>(c.nom+" "+c.prenom+" "+c.mat).toLowerCase().includes(q.toLowerCase()));const ed=can("ch")&&["Président","Vice-président","Secrétaire","Secrétaire adjointe"].includes(me.role);
 return `<input placeholder="🔍 Rechercher nom, prénom, matricule" value="${esc(q)}" oninput="q=this.value;draw();document.querySelector('input').focus()">
 ${ed?`<div class="card"><b>Ajouter un choriste</b><input id="cn" placeholder="Nom"><input id="cp" placeholder="Prénom"><input id="ct" placeholder="Téléphone"><button onclick="addCh()">Ajouter</button></div><div class="card"><b>Importer une liste</b><div class="m">Un choriste par ligne : NOM Prénom ; téléphone</div><textarea id="im" rows="5"></textarea><button onclick="impCh()">Importer</button></div>`:""}
 <div class="card">${L.map(c=>{const r=reg(c.id);return `<div class="row"><div onclick="fid='${c.id}';draw()" style="flex:1"><b>${esc(c.nom)} ${esc(c.prenom)}</b><div class="m">${esc(c.mat)} · ${esc(c.tel||"")}</div></div><div><span class="tag">${r.cat} ${r.pc}%</span>${ed?`<button class="s" onclick="deact('${c.id}')">✕</button>`:""}</div></div>`}).join("")||"<div class=m>Aucun choriste</div>"}</div>`},
pr(){if(sid)return V.sess();const ss=S.sessions.sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><b>Nouvelle séance</b><select id="st"><option>Répétition</option><option>Messe</option><option>Autre activité</option></select><input id="sd" type="date" value="${new Date().toISOString().slice(0,10)}"><button onclick="newSess()">Créer (tous présents)</button></div>
 <div class="card">${ss.map(s=>`<div class="row" onclick="sid='${s.id}';draw()"><div><b>${esc(nm(s))}</b> <span class="m">${s.date}</span></div><span class="tag">${sessionRate(s)}%</span></div>`).join("")||"<div class=m>Aucune séance</div>"}</div>`},
sess(){const s=S.sessions.find(x=>x.id==sid);const R=Object.fromEntries(S.records.filter(r=>r.sid==sid).map(r=>[r.cid,r]));const co=can("co"),mode=tab=="co";
 const lab={P:"✅",A:"❌",E:"🟡",R:"🟠"};
 return `<button class="s" onclick="sid=null;draw()">← Retour</button><button class="s" onclick="wa()">📤 WhatsApp</button>${locked(s)?" 🔒":""}<div class="card"><b>${esc(nm(s))} — ${s.date}</b><div class="m">Présence ${sessionRate(s)}% · ${S.records.filter(r=>r.sid==sid&&r.paid).length} payé(s) · ${F(S.records.filter(r=>r.sid==sid&&r.paid).length*amt(s))} collectés (${F(amt(s))}/choriste)</div></div>
 <div class="card">${actifs().map(c=>{const r=R[c.id]||{};return `<div class="row"><span>${esc(c.nom)} ${esc(c.prenom)}</span>${mode?`<button class="${r.paid?"g":"s"}" onclick="pay('${c.id}')">${r.paid?"Payé":"Non payé"}</button>`:`<button class="s" onclick="cyc('${c.id}')">${lab[r.st]||"❌"}</button>`}</div>`}).join("")}</div>
 ${mode?"":`<p class="m">Touchez l'icône pour changer : ✅ présent · ❌ absent · 🟡 excusé · 🟠 retard</p>`}`},
co(){if(sid)return V.sess();const ss=S.sessions.sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="card"><b>Nouvelle séance de cotisation</b><select id="st"><option>Répétition</option><option>Messe</option><option>Autre activité</option><option value="Événement">Événement (cotisation spéciale)</option></select><input id="sd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="sl" placeholder="Nom de l'événement (ex. Fête patronale)"><input id="sa" type="number" inputmode="numeric" placeholder="Montant par choriste (événement seulement)"><button onclick="newSess()">Créer et ouvrir la liste</button><div class="m">Si la séance existe déjà (créée dans Présences), choisissez-la dans la liste ci-dessous.</div></div><div class="card"><b>Cotisation : ${cfg().cot} FCFA / choriste</b><div class="m">Choisissez la séance</div>${ss.map(s=>{const p=S.records.filter(r=>r.sid==s.id&&r.paid).length,n=S.records.filter(r=>r.sid==s.id).length;return `<div class="row" onclick="sid='${s.id}';draw()"><div><b>${esc(nm(s))}</b> <span class="m">${s.date}</span></div><span class="tag">${p}/${n} · reste ${F((n-p)*amt(s))}</span></div>`}).join("")||"<div class=m>Créez d'abord une séance</div>"}</div>`},
ca(){const T=S.tx.sort((a,b)=>b.d.localeCompare(a.d));const k=cfg();
 return `<div class="stat"><b>🏦 ${F(solde())}</b><span>Solde actuel (initial ${F(k.init)})</span></div>
 <div class="card"><b>Nouvelle opération</b><select id="ty"><option value="in">Entrée</option><option value="out">Sortie</option></select><input id="am" type="number" inputmode="numeric" placeholder="Montant FCFA"><select id="cg"><option>Don</option><option>Contribution</option><option>Matériel</option><option>Transport</option><option>Impression</option><option>Réparation</option><option>Autre</option></select><input id="mo" placeholder="Motif"><button onclick="addTx()">Enregistrer</button></div>
 <div class="card">${T.map(t=>`<div class="row" style="${t.void?"opacity:.45;text-decoration:line-through":""}"><div><b>${esc(t.cat)}</b> <span class="m">${t.d.slice(0,10)} · ${esc(t.by)}</span><div class="m">${esc(t.motif||"")}</div></div><div><b class="${t.type=="in"?"ok":"ko"}">${t.type=="in"?"+":"-"}${t.amt}</b>${t.void||t.auto?"":`<button class="s" onclick="voidTx('${t.id}')">Annuler</button>`}</div></div>`).join("")||"<div class=m>Aucune opération</div>"}</div>`},
de(){const st={W:"🟡 En attente",A:"🟢 Approuvée",X:"🔴 Refusée",P:"💰 Payée"};
 return `<div class="card"><b>Demande d'argent</b><input id="rm" type="number" inputmode="numeric" placeholder="Montant FCFA"><input id="rt" placeholder="Motif (ex. cordes)"><button onclick="addReq()">Envoyer</button></div>
 <div class="card">${S.requests.sort((a,b)=>b.d.localeCompare(a.d)).map(r=>`<div class="row"><div><b>${F(r.amt)}</b> — ${esc(r.motif)}<div class="m">${esc(r.by)} · ${st[r.st]}</div></div><div>${APPROVE.includes(me.role)&&r.st=="W"?`<button class="g" onclick="setReq('${r.id}','A')">✓</button><button class="k" onclick="setReq('${r.id}','X')">✕</button>`:""}${can("ca")&&r.st=="A"?`<button onclick="payReq('${r.id}')">Payer</button>`:""}</div></div>`).join("")||"<div class=m>Aucune demande</div>"}</div>`},
ra(){const L=actifs().map(c=>({c,...reg(c.id)})).sort((a,b)=>a.pc-b.pc);
 return `<div class="card"><b>Régularité</b> <span class="m">(seuils ${cfg().reg}% / ${cfg().moy}%)</span>${L.map(x=>`<div class="row"><span>${esc(x.c.nom)} ${esc(x.c.prenom)}</span><span class="tag">${x.cat} ${x.p}/${x.tot} · ${x.pc}%</span></div>`).join("")}</div>
 <button onclick="pdfPres()">📄 PDF régularité</button>${can("ca")?`<button onclick="pdfCaisse()">📄 PDF caisse</button>`:""}<button onclick="csv()">⬇️ Exporter CSV (présences)</button>${can("ca")?`<button onclick="csvTx()">⬇️ Exporter CSV (caisse)</button>`:""}`},
us(){const k=cfg();return `<div class="card"><b>Paramètres</b><label class="m">Cotisation (FCFA)</label><input id="s1" type="number" value="${k.cot}"><label class="m">Solde initial caisse</label><input id="s2" type="number" value="${k.init}"><label class="m">Seuil minimum caisse</label><input id="s3" type="number" value="${k.seuil}"><label class="m">Seuil Régulier % / Moyen %</label><input id="s4" type="number" value="${k.reg}"><input id="s5" type="number" value="${k.moy}"><label class="m">Verrouiller les séances après (jours)</label><input id="s6" type="number" value="${k.lock}"><button onclick="saveCfg()">Enregistrer</button></div>
 <div class="card"><b>Nouveau compte</b><input id="un" placeholder="Nom"><select id="ur">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select><input id="ue" type="email" placeholder="Adresse e-mail (peut être fictive)"><input id="up" type="password" placeholder="Mot de passe (6 min.)"><button onclick="addUser()">Créer</button>
 ${S.users.map(u=>`<div class="row"><span>${esc(u.name)} <span class="m">${esc(u.role)}</span></span>${u.id!=me.id?`<button class="s" onclick="togUser('${u.id}',${u.actif!==false})">${u.actif!==false?"Désactiver":"Activer"}</button>`:""}</div>`).join("")}</div>
 <div class="card"><b>Journal d'activité</b>${S.logs.sort((a,b)=>b.d.localeCompare(a.d)).slice(0,30).map(l=>`<div class="row m">${l.d.slice(0,16).replace("T"," ")} · ${esc(l.t)}</div>`).join("")}</div>`}
};
V.mt=function(){const ed=["Président","Vice-président","Trésorier"].includes(me.role);return `${ed?`<div class="card"><b>Nouveau matériel</b><input id="mn" placeholder="Nom (ex. micro)"><input id="mq" type="number" placeholder="Quantité" value="1"><input id="mp" type="number" placeholder="Prix total FCFA"><select id="ms"><option>Neuf</option><option>Bon</option><option>Usé</option><option>Hors service</option></select><input id="ml" placeholder="Lieu de stockage"><label class="m"><input type="checkbox" id="mx" style="width:auto"> Enregistrer la dépense en caisse</label><button onclick="addMat()">Ajouter</button></div>`:""}<div class="card">${S.materials.map(m=>`<div class="row"><div><b>${esc(m.nom)}</b> ×${m.qte}<div class="m">${esc(m.etat)} · ${esc(m.lieu||"")} · ${F(m.prix)} · ${m.date}</div></div></div>`).join("")||"<div class=m>Aucun matériel</div>"}</div>`};
V.fiche=function(){const c=S.choristes.find(x=>x.id==fid);if(!c){fid=null;return V.ch()}const R=S.records.filter(r=>r.cid==fid).map(r=>({...r,s:S.sessions.find(s=>s.id==r.sid)})).filter(r=>r.s).sort((a,b)=>b.s.date.localeCompare(a.s.date)),g=reg(fid),np=R.filter(r=>!r.paid).length,lab={P:"✅ Présent",A:"❌ Absent",E:"🟡 Excusé",R:"🟠 Retard"};return `<button class="s" onclick="fid=null;draw()">← Retour</button><div class="card"><b>${esc(c.nom)} ${esc(c.prenom)}</b><div class="m">${esc(c.mat)} · ${esc(c.tel||"")}</div><div>${g.cat} · ${g.p}/${g.tot} séances (${g.pc}%)</div><div>Cotisations impayées : <b class="ko">${np}</b> → ${F(R.filter(r=>!r.paid).reduce((a,r)=>a+amt(r.s),0))}</div></div><div class="card">${R.map(r=>`<div class="row"><span>${r.s.date} <span class="m">${esc(nm(r.s))}</span></span><span>${lab[r.st]} · ${r.paid?"💰":"⭕"}</span></div>`).join("")||"<div class=m>Aucun historique</div>"}</div>`};
const nm=s=>s.type+(s.label?" – "+s.label:""),amt=s=>s.amt||cfg().cot;
const locked=s=>me.role!="Président"&&(Date.now()-new Date(s.date))/864e5>cfg().lock;
async function addMat(){const nom=$("mn").value.trim(),prix=parseInt($("mp").value)||0;if(!nom)return alert("Nom requis");const id=uid();await put("materials",id,{nom,qte:+$("mq").value||1,prix,etat:$("ms").value,lieu:$("ml").value,date:new Date().toISOString().slice(0,10)});if($("mx").checked&&prix>0)await put("tx","mat_"+id,{type:"out",amt:prix,cat:"Matériel",motif:nom,d:new Date().toISOString(),by:me.name,void:false,auto:true});act("a ajouté le matériel "+nom)}
async function impCh(){const L=$("im").value.split("\n").map(x=>x.trim()).filter(Boolean);let n=S.choristes.length,k=0;for(const l of L){const[a,tel=""]=l.split(/[;,\t]/).map(x=>x.trim());const w=a.split(/\s+/),nom=w[0].toUpperCase(),prenom=w.slice(1).join(" ");if(S.choristes.some(c=>c.nom==nom&&c.prenom==prenom))continue;n++;k++;await put("choristes",uid(),{nom,prenom,tel,mat:"C"+String(n).padStart(3,"0"),actif:true})}act("a importé "+k+" choristes");alert(k+" choriste(s) ajouté(s)")}
function wa(){const s=S.sessions.find(x=>x.id==sid),r=S.records.filter(x=>x.sid==sid),p=r.filter(x=>x.st=="P"||x.st=="R").length,pd=r.filter(x=>x.paid).length,[y,m,d]=s.date.split("-");let t=`*${nm(s)} du ${d}/${m}/${y}*\nPrésents : ${p}\nAbsents : ${r.length-p}\nTaux de présence : ${sessionRate(s)} %\nCotisations : ${pd}/${r.length} (${F(pd*amt(s))})`;if(can("ca"))t+=`\nSolde caisse : ${F(solde())}`;try{navigator.clipboard.writeText(t)}catch(e){}window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")||prompt("Copiez ce texte",t)}
async function pdf(name,title,lines){const J=window.jspdf;if(!J)return alert("PDF indisponible");const d=new J.jsPDF();d.setFontSize(14);d.text(title,14,16);d.setFontSize(10);let y=26;for(const l of lines){if(y>280){d.addPage();y=16}d.text(String(l).replace(/[\u202f\u00a0]/g," ").replace(/[^\x20-\xff]/g,""),14,y);y+=6}dlf(name,d.output("blob"))}
const pdfPres=()=>pdf("regularite.pdf","Régularité des choristes",actifs().map(c=>{const r=reg(c.id);return `${c.nom} ${c.prenom} | ${r.p}/${r.tot} | ${r.pc}% | ${r.cat}`}));
const pdfCaisse=()=>pdf("caisse.pdf","Journal de caisse - Solde "+F(solde()),S.tx.filter(t=>!t.void).sort((a,b)=>a.d.localeCompare(b.d)).map(t=>`${t.d.slice(0,10)} ${t.type=="in"?"+":"-"}${t.amt} | ${t.cat} | ${t.motif||""}`));
async function addCh(){const n=$("cn").value.trim();if(!n)return;const mat="C"+String(S.choristes.length+1).padStart(3,"0");await put("choristes",uid(),{nom:n.toUpperCase(),prenom:$("cp").value.trim(),tel:$("ct").value.trim(),mat,actif:true});act("a ajouté le choriste "+n)}
async function deact(id){if(confirm("Désactiver ce choriste ? (historique conservé)")){await db.collection("choristes").doc(id).update({actif:false});act("a désactivé un choriste")}}
async function newSess(){const date=$("sd").value,type=$("st").value,label=$("sl")?$("sl").value.trim():"",amt=$("sa")&&$("sa").value?parseInt($("sa").value):0;if(type=="Événement"&&!(amt>0))return alert("Indiquez le montant par choriste");if(S.sessions.some(s=>s.date==date&&s.type==type&&(s.label||"")==label))return alert("Cette séance existe déjà");const id=uid();await put("sessions",id,{date,type,cot:true,label,amt:type=="Événement"?amt:0});await Promise.all(actifs().map(c=>put("records",id+"_"+c.id,{sid:id,cid:c.id,st:"P",paid:false})));act("a créé la séance "+type+" du "+date);sid=id;draw()}
async function cyc(cid){if(locked(S.sessions.find(x=>x.id==sid)))return alert("Séance verrouillée : seul le Président peut la modifier");const r=S.records.find(x=>x.id==sid+"_"+cid)||{st:"A"};const n={P:"A",A:"E",E:"R",R:"P"}[r.st]||"P";await put("records",sid+"_"+cid,{sid,cid,st:n,paid:!!r.paid})}
async function pay(cid){const id=sid+"_"+cid,r=S.records.find(x=>x.id==id)||{st:"A"};if(!can("co"))return alert("Non autorisé");if(locked(S.sessions.find(x=>x.id==sid)))return alert("Séance verrouillée : seul le Président peut la modifier");const paid=!r.paid;await put("records",id,{sid,cid,st:r.st||"A",paid});const ch=S.choristes.find(c=>c.id==cid),s=S.sessions.find(x=>x.id==sid);
 {const o={type:"in",amt:amt(s),cat:s.type=="Événement"?"Cotisation événement":"Cotisation",motif:(ch?.nom||"")+" – "+nm(s)+" "+s.date,d:new Date().toISOString(),by:me.name,void:!paid,auto:true};if(S.tx.find(x=>x.id=="cot_"+id))await db.collection("tx").doc("cot_"+id).update({void:o.void});else await put("tx","cot_"+id,o)}act((paid?"a enregistré":"a retiré")+" la cotisation de "+ch?.nom)}
async function addTx(){const amt=parseInt($("am").value);if(!(amt>0))return alert("Montant invalide");if(!confirm("Enregistrer "+F(amt)+" ?"))return;await put("tx",uid(),{type:$("ty").value,amt,cat:$("cg").value,motif:$("mo").value,d:new Date().toISOString(),by:me.name,void:false});act("a enregistré une opération de "+F(amt))}
async function voidTx(id){if(confirm("Annuler cette opération ? Elle restera visible, barrée.")){await db.collection("tx").doc(id).update({void:true});act("a annulé une opération")}}
async function addReq(){const amt=parseInt($("rm").value);if(!(amt>0)||!$("rt").value)return alert("Montant et motif requis");await put("requests",uid(),{amt,motif:$("rt").value,by:me.name,st:"W",d:new Date().toISOString()});act("a demandé "+F(amt))}
async function setReq(id,st){await db.collection("requests").doc(id).update({st});act((st=="A"?"a approuvé":"a refusé")+" une demande")}
async function payReq(id){const r=S.requests.find(x=>x.id==id);if(!confirm("Payer "+F(r.amt)+" depuis la caisse ?"))return;await put("tx","req_"+id,{type:"out",amt:r.amt,cat:"Demande",motif:r.motif,d:new Date().toISOString(),by:me.name,void:false,auto:true});await db.collection("requests").doc(id).update({st:"P"});act("a payé la demande de "+F(r.amt))}
async function togUser(id,on){await db.collection("users").doc(id).update({actif:!on})}
async function saveCfg(){await put("settings","main",{cot:+$("s1").value,init:+$("s2").value,seuil:+$("s3").value,reg:+$("s4").value,moy:+$("s5").value,lock:+$("s6").value});act("a modifié les paramètres")}
async function save(name,rows){const t="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(";")).join("\n");dlf(name,new Blob([t],{type:"text/csv"}))}
const csv=()=>save("presences.csv",[["Nom","Prénom","Séances","Présences","Taux %","Catégorie"],...actifs().map(c=>{const r=reg(c.id);return[c.nom,c.prenom,r.tot,r.p,r.pc,r.cat]})]);
const csvTx=()=>save("caisse.csv",[["Date","Type","Montant","Catégorie","Motif","Par","Annulée"],...S.tx.map(t=>[t.d.slice(0,10),t.type,t.amt,t.cat,t.motif,t.by,t.void?"oui":""])]);
async function demo(){const N=["KOUASSI","ADJOVI","HOUNKPATIN","DOSSOU","AGBO","SOGLO","TOGNI","ZINSOU","AHOUANDJINOU","BIAOU","GBEDO","LOKO","MEDENOU","OGOUNDE","QUENUM","SANT'ANNA","TOSSOU","VODOUNON","YEHOUENOU","ZANNOU"],P=["Marie","Paul","Jean","Rose","Luc","Anne","Marc","Claire","Joseph","Esther","Pierre","Judith","David","Lydie","Eric","Sonia","Alain","Grâce","Hervé","Nadège"];
 const ids=[];for(let i=0;i<20;i++){const id="demo"+i;ids.push(id);await put("choristes",id,{nom:N[i],prenom:P[i],tel:"DÉMO",mat:"D"+String(i+1).padStart(3,"0"),actif:true})}
 for(let w=0;w<6;w++){const dt=new Date(Date.now()-w*7*864e5);for(const[type,off]of[["Répétition",0],["Messe",1]]){const d=new Date(dt);d.setDate(d.getDate()+off-d.getDay()+(type=="Messe"?7:6)-7);const date=d.toISOString().slice(0,10),id="ds"+w+type[0];await put("sessions",id,{date,type,cot:true});for(let i=0;i<20;i++){const ab=(i*7+w*3)%(i<4?2:i<14?9:3)==0,paid=!ab&&(i+w)%6!=0;await put("records",id+"_"+ids[i],{sid:id,cid:ids[i],st:ab?"A":"P",paid});if(paid)await put("tx","cot_"+id+"_"+ids[i],{type:"in",amt:25,cat:"Cotisation",motif:N[i]+" (démo)",d:d.toISOString(),by:"Démo",void:false,auto:true})}}}
 await put("tx","demo1",{type:"out",amt:3000,cat:"Matériel",motif:"Câbles (démo)",d:new Date().toISOString(),by:"Démo",void:false});await put("requests","demo1",{amt:5000,motif:"Cordes (démo)",by:"Surveillant",st:"W",d:new Date().toISOString()});await put("settings","main",{cot:25,init:15000,seuil:5000,reg:80,moy:60})}
function dlf(n,b){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}
function loginUI(first){$("app").innerHTML=first?`<div class="card"><h3>Premi\u00e8re utilisation</h3><p class="m">Cr\u00e9ez le compte du Pr\u00e9sident (une seule fois).</p><input id="n" placeholder="Nom"><input id="em" type="email" placeholder="Adresse e-mail"><input id="p" type="password" placeholder="Mot de passe (6 min.)"><button onclick="mkAdmin()">Cr\u00e9er</button><button class="s" onclick="loginUI()">Retour</button></div>`:`<div class="card"><h3>Connexion</h3><input id="em" type="email" placeholder="Adresse e-mail"><input id="p" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><button class="s" onclick="loginUI(1)">Premi\u00e8re utilisation (Pr\u00e9sident)</button></div>`}
async function login(){try{await auth.signInWithEmailAndPassword($("em").value.trim(),$("p").value)}catch(e){alert("Identifiants incorrects, ou pas de r\u00e9seau pour la premi\u00e8re connexion")}}
async function mkAdmin(){const n=$("n").value.trim(),em=$("em").value.trim(),p=$("p").value;if(!n||!em||p.length<6)return alert("Nom, e-mail et mot de passe (6 min.) requis");creating=true;try{const cr=await auth.createUserWithEmailAndPassword(em,p);const b=fs.batch();b.set(fs.collection("meta").doc("bootstrap"),{d:new Date().toISOString()});b.set(fs.collection("users").doc(cr.user.uid),{name:n,role:"Pr\u00e9sident",actif:true});await b.commit();creating=false;await loadMe(cr.user)}catch(e){creating=false;alert("Impossible : "+e.message)}}
async function addUser(){const n=$("un").value.trim(),em=$("ue").value.trim(),p=$("up").value;if(!n||!em||p.length<6)return alert("Nom, e-mail et mot de passe (6 min.) requis");try{const sec=firebase.apps.find(a=>a.name=="sec")||firebase.initializeApp(CFG,"sec");const cr=await sec.auth().createUserWithEmailAndPassword(em,p);await put("users",cr.user.uid,{name:n,role:$("ur").value,actif:true});await sec.auth().signOut();act("a cr\u00e9\u00e9 le compte "+n)}catch(e){alert("Erreur : "+e.message)}}
async function out(){if(!navigator.onLine&&!confirm("Hors connexion : vous ne pourrez pas vous reconnecter sans r\u00e9seau. Quitter quand m\u00eame ?"))return;stop();await auth.signOut()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
boot();
</script></body></html>
